[versions]
jdkVersion8 = "1.8"
jdkVersion11 = "11"
jdkVersion17 = "17"

kotlinVersion = "2.4.0"   # android jectpack compose 1.5.3 requires 1.9.10 kotlin = "2.4.0"
devtoolsKspVersion = "2.3.9" #"2.4.0-1.0.26"  #  Room 数据库（编译期生成数据库实现类）需要
kotlinxCoroutinesVersion = "1.11.0" # Kotlin was updated to 2.2.20
kotlinxSerializationVersion = "1.11.0" # kotlinx-serialization = "1.11.0"


##### android #####
compileSdkVersion = "37"
targetSdkVersion = "35"
androidGradlePlugin = "9.2.1"

coreKtxVersion = "1.19.0" # https://developer.android.com/jetpack/androidx/releases/core?hl=zh-cn
appcompat="1.7.1"
constraintlayout = "2.2.1"
lifecycle = "2.11.0" # Lifecycle 2.8.x 正式全面引入了 Kotlin Multiplatform (KMP) 支持，且原生适配 JDK 17/21

#注意：从 Kotlin 2.0 开始，Compose 编译器已经合并进 Kotlin 官方仓库，无需再配置 composeCompiler 版本！
composeVersion = '1.11.3' # https://developer.android.com/jetpack/androidx/releases/compose-ui#kts
compose-bom = "2026.06.00" # https://developer.android.com/develop/ui/compose/bom/bom-mapping?hl=zh-cn
constraintlayout_compose = "1.1.1"
composeMaterial3Version = "1.4.0" #https://developer.android.com/jetpack/androidx/releases/compose-material3?hl=zh-cn
materialIconsVersion = "1.7.8" #https://mvnrepository.com/artifact/androidx.compose.material/material-icons-extended
activity_compose="1.12.1"

room_version = "2.8.4"   ## Room 2.7.x 全面接入了 Kotlin Symbol Processing (KSP) 2.x，并且原生的 KMP 架构已经非常稳定

workManagerVersion = "2.11.2"
savedstateVersion = "1.5.0"
# DataStore 1.1.x 同样重构为了 KMP 架构，完美支持更现代的挂起函数与原子性操作
datastoreVersion = "1.2.1"

junitVersion = "4.13.2"
junitExt = "1.1.5"
espressoCore = "3.5.1"

composePrefs3Version = "1.1.0"

##### Ktor #####
ktor_version = "3.6.0"


##### SQL #####
#mysql-connector-java 是旧版本 Maven 坐标，mysql-connector-j 是 MySQL 官方从 8.0.31 版本开始推荐的新坐标，更规范且便于维护
mysqlConnectorVersionOld = "8.0.31"
mysqlConnectorVersionNew = "8.4.0"

postgresql = "42.7.13"

hikariCP_version = "7.1.0"
komapperVersion = "7.0.0"

exposed = "1.3.0"
h2 = "2.4.240"
h2-r2dbc = "1.1.0.RELEASE"
sqlite-jdbc="3.53.4.0"

koin_version = "4.2.2"
caffeineVersion = "3.2.4"
logback_version = "1.5.35"
slf4jSimpleVersion = "2.0.18"
commonsLang3Version = "3.20.0"
commonsCodecVersion = "1.22.0"

mongodbDriverVersion = "5.11.1"

##### plugin#####
proguardVersion = "6.2.2"
shadowVersion = "7.1.2"

##### other #####
ktorKitVersion = "2.0.0-snapshot"
yinyangVersion = "1.0.0"
ruleRuntimeVersion = "1.0.0"
wxSdkVersion = "0.4.0"
spiderVersion = "2.0.0"
fileProxyVersion = "1.1.0"
rwsLibVersion = "1.1.0"
composerouterVersion = "1.4.0"
composeuiVersion = "1.1.0"
cronVersion = "1.0.0"

